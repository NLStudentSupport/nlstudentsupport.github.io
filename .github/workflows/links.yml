name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Several Dutch institutions sit behind a bot filter and answer 403 or
          # 429 to anything that is not a browser, so those are accepted rather
          # than reported. LinkedIn answers 999 and Google Forms 401 to the same
          # kind of request, and neither can be made to behave, so those two
          # hosts are skipped. The localhost example in the README is not a link.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --root-dir "${{ github.workspace }}"
            --accept "200..204,206,403,429"
            --exclude "^http://localhost"
            --exclude "linkedin\.com"
            --exclude "forms\.gle"
            js/data.js index.html iran-support/index.html README.md
          fail: true
      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling on every run keeps the schedule alive.
      - name: Keep the scheduled workflow enabled
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/links.yml/enable
